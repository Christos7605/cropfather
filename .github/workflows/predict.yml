name: Prediction

on:
  repository_dispatch:
    types: [predict]

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the model
        run: |
          python -m pip install --upgrade pip
          pip install numpy planetary-computer pystac-client rasterio shapely pyproj stackstac xarray dask affine earthengine-api pandas joblib scikit-learn requests

      - name: Run the model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SALINITY_GEE_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          SALINITY_GEE_PROJECT: firld-512718
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: python backend/worker/predictor_worker.py --once
