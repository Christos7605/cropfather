name: NDVI check

on:
  repository_dispatch:
    types: [ndvi]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the checker
        run: |
          python -m pip install --upgrade pip
          pip install numpy planetary-computer pystac-client rasterio shapely pyproj stackstac xarray dask affine

      - name: Run the NDVI check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: python backend/worker/ndvi_worker.py --once
